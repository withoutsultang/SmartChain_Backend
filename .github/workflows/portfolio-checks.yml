name: Portfolio checks
on:
  workflow_dispatch:
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Login failure database regression
        run: ./gradlew test --tests '*LoginFailurePersistenceTest'
      - name: Full backend tests and build
        if: always()
        run: ./gradlew clean build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: build/reports/tests/
