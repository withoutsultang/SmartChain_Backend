          keywords: [교육이수, 안전교육, education status, 교육현황, 수료]
          required: true
        - name: safety.fire.inspection
          display-name: 소방점검 결과
          keywords: [소방점검, fire inspection, 소화기, 방화, 소방]
          required: true
        - name: safety.risk.assessment
          display-name: 위험성 평가
          keywords: [위험성평가, risk assessment, 위험평가, 리스크]
