        - name: compliance.education.plan
          display-name: 교육 계획
          keywords: [교육계획, education plan, 법정교육, 교육일정]
          required: false
        - name: compliance.education.attendance
          display-name: 교육 출석부
          keywords: [출석부, attendance, 교육출석, 참석명단]
          required: false
        - name: compliance.education.photo
          display-name: 교육 사진
          keywords: [교육사진, education photo, 교육일사진]
          required: false
        - name: compliance.other
          display-name: 기타 문서
          keywords: []
          required: false
    cross-validations:
      - name: esg.energy.electricity.month_match
        display-name: 전기 월별 대사(사용량 vs 고지서)
        slots: [esg.energy.electricity.usage, esg.energy.electricity.bill]
      - name: esg.energy.gas.month_match
        display-name: 가스 월별 대사(사용량 vs 고지서)
        slots: [esg.energy.gas.usage, esg.energy.gas.bill]
      - name: esg.energy.water.month_match
        display-name: 용수 월별 대사(사용량 vs 고지서)
        slots: [esg.energy.water.usage, esg.energy.water.bill]
      - name: esg.energy.electricity.peak_2024_vs_2025
        display-name: 전기 사용량 피크 비교(2024 vs 2025)
        slots: [esg.energy.electricity.usage]
      - name: esg.hazmat.msds.coverage
        display-name: 유해물질 MSDS 커버리지
        slots: [esg.hazmat.msds, esg.hazmat.inventory]


---
# ========================================
# 로컬 개발 환경
# ========================================
spring:
  profiles:
    active: local
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/smartchain
    username: esg
    password: esg1234
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    show-sql: true
  open-in-view: false

# Swagger 설정
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

# JWT 설정
jwt:
  secret: smartchainPlatformSecretKeyForJwtTokenGenerationMustBe256BitsLongNiceDay
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# 로깅 설정
logging:
  level:
    com.smartchain.platform: DEBUG
    org.hibernate.SQL: DEBUG

# reCAPTCHA v3 설정
recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:6LcC-V8sAAAAAHpYoUj5q31vQh9hDduj-4m7hvGc}
  score-threshold: ${RECAPTCHA_SCORE_THRESHOLD:0.5}
  enabled: ${RECAPTCHA_ENABLED:false}

# DataInitializer 설정
app:
  data-initializer:
    enabled: true

# 파일 저장소 설정 (로컬)
file:
  storage:
    local:
      base-path: ./uploads

# AI 관련 설정들 (로컬 기준)
ai:
  run-api:
    url: http://127.0.0.1:8000
    timeout-seconds: 180
    max-retry: 3
  risk-api:
    url: http://127.0.0.1:8002
    timeout-seconds: 60
    max-retry: 3
    target-companies:
      - 포스코홀딩스
      - 현대제철
      - 성광벤드
      - 동국제강
      - HD현대일렉트릭
  chat:
    base-url: http://127.0.0.1:8001
    admin-api-key: ${AI_CHAT_ADMIN_KEY:test-key}
    timeout-seconds: 30

---
# ========================================
# 운영/개발 서버 환경 (Azure 통합)
# ========================================
spring:
  config:
    activate:
      on-profile: prod, dev

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container-name: ${AZURE_STORAGE_CONTAINER:smartchain-files}

app:
  data-initializer:
    enabled: ${DATA_INIT_ENABLED:false}

logging:
  level:
    com.smartchain.platform: INFO

ai:
  risk-api:
    url: ${AI_RISK_API_URL:http://127.0.0.1:8002}
    timeout-seconds: 60
    max-retry: 3
    target-companies:
      - 포스코홀딩스
      - 현대제철
      - 성광벤드
      - 동국제강
      - HD현대일렉트릭
  chat:
    base-url: ${AI_CHAT_URL:http://127.0.0.1:8001}
    admin-api-key: ${AI_CHAT_ADMIN_KEY}